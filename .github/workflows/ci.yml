name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

# CI runs the two commands you run locally: tools/setup.ps1, then tools/check.ps1.
# Actions are pinned by commit: a tag can be moved, a commit cannot. The comment names
# the release; to update, take the commit of the new tag (git ls-remote <repository>).
jobs:
  check:
    name: check.ps1 (lint, types, project, tests)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache Godot (the version pinned in kit.json)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('kit.json') }}

      - name: Set up (Python tools, Godot, first import, doctor)
        run: ./tools/setup.ps1 -InstallGodot

      # A hosted runner has a few slow cores: one gate may take longer than the 900 s
      # that is the limit on a developer's machine.
      - name: Check (every gate)
        run: ./tools/check.ps1 -GateTimeoutSeconds 1800

      - name: Upload gate logs and test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
